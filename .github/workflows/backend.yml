name: Backend CI

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Build and Test Backend
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gamitool_notif_hub
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      # Only the e2e tier needs Mongo (unit tests mock everything, integration
      # tests only touch MySQL/Redis) — but service containers are declared
      # once per job, so it's here alongside the other two.
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: nest-notif-hub

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: gamitool_notif_hub
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      # e2e-env.setup.ts overrides MYSQL_DATABASE/REDIS_DB/MONGO_URI to
      # dedicated, isolated values before AppModule ever boots — see that
      # file. Everything below is only for env vars it does NOT override:
      # required for the full app to boot at all (JWT_SECRET — read via
      # ConfigService.getOrThrow at module-init time, real app boot fails
      # without it) or referenced by strategies/processors that are never
      # actually exercised by the e2e suite (Authentik OIDC, n8n) but still
      # need some string value present so their constructors don't choke on
      # `undefined`. None of these protect anything real — same reasoning
      # as the MySQL root password above.
      JWT_SECRET: ci-test-jwt-secret
      SESSION_SECRET: ci-test-session-secret
      AUTHENTIK_URL: http://localhost:9000
      AUTHENTIK_APP_SLUG: ci-test-app
      CLIENT_ID: ci-test-client-id
      CLIENT_SECRET: ci-test-client-secret
      CALLBACK: http://localhost:3001/auth/oidc/callback
      API_TOKEN: ci-test-api-token
      N8N_WEBHOOK_BASE_URL: http://localhost:5678
      N8N_WEBHOOK_SECRET: ci-test-n8n-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.6.0
          cache: npm
          cache-dependency-path: nest-notif-hub/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Sync database schema for integration tests
        run: npm run test:integration:sync-schema

      - name: Run integration tests
        run: npm run test:integration

      # Last and slowest on purpose — boots the entire real app (HTTP +
      # WebSocket + MySQL + Redis + Mongo, every consumer actually running).
      # Runs after the cheaper tiers so a broken unit/integration test fails
      # fast without paying for this one. `npm run test:e2e` auto-triggers
      # `pretest:e2e` first (npm's pre-script convention) — resets the
      # dedicated e2e MySQL database and Redis DB index completely fresh
      # before every run, same as running it locally.
      - name: Run e2e tests
        run: npm run test:e2e

      - name: Build application
        run: npm run build
